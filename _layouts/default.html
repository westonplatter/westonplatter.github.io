<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "" %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 50 }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="/favicon.ico">
  {% if page.url == "/" %}<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/atom.xml' | absolute_url }}">{% endif %}
  <meta property="og:title" content="{% if page.title and page.title != '' %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 50 }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta name="twitter:card" content="summary">
  <style>
    :root {
      --bg: #f1f2f4;
      --bg-alt: #e7e9ed;
      --text: #2f3338;
      --text-muted: #6f7782;
      --accent: #4f5966;
      --border: #cdd2d8;
      --link: #4a5563;
      --link-hover: #2f3338;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Noto Sans", sans-serif;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
    }

    a:hover {
      color: var(--link-hover);
      border-bottom-color: var(--text);
    }

    .site-header {
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .site-header .site-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .site-header .site-title a {
      color: var(--text);
      border: none;
    }

    .site-header nav {
      margin-top: 0.5rem;
    }

    .site-header nav a {
      color: var(--text-muted);
      margin-right: 1.25rem;
      font-size: 13px;
      border: none;
    }

    .site-header nav a:hover {
      color: var(--text);
    }

    .site-footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Post content styles */
    .content h1 { font-size: 20px; font-weight: 600; margin: 2rem 0 1rem; }
    .content h2 { font-size: 16px; font-weight: 600; margin: 1.75rem 0 0.75rem; }
    .content h3 { font-size: 14px; font-weight: 600; margin: 1.5rem 0 0.5rem; }
    .content p { margin-bottom: 1rem; }
    .content ul, .content ol { margin: 0 0 1rem 1.5rem; }
    .content li { margin-bottom: 0.25rem; }
    .content blockquote {
      border-left: 2px solid var(--border);
      padding-left: 1rem;
      color: var(--text-muted);
      margin: 1rem 0;
    }

    .content pre {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .content code {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: var(--bg-alt);
      padding: 0.15rem 0.35rem;
      font-size: 13px;
    }

    .content pre code {
      background: none;
      padding: 0;
    }

    /* Rouge line-number table: undo the generic pre/table styles */
    .content .rouge-table { width: auto; margin: 0; border: none; font-size: inherit; }
    .content .rouge-table td { padding: 0; border: none; vertical-align: top; }
    .content .rouge-table pre {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      overflow: visible;
      font-size: inherit;
    }
    .content .rouge-table .rouge-gutter {
      padding-right: 1rem;
      color: #9aa1a9;
      text-align: right;
      user-select: none;
    }

    /* Code blocks with toolbar (wrap + copy), added by the script below */
    .content .codebox { margin: 1rem 0; }
    .content .codebox pre.highlight { margin: 0; }
    .content .code-toolbar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.4rem 0.25rem 0.75rem;
      background: #dde0e5;
      border: 1px solid var(--border);
      border-bottom: none;
      font-size: 12px;
      color: var(--text-muted);
    }
    .content .code-toolbar .code-lang { margin-right: auto; }
    .content .code-toolbar button {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1rem 0.6rem;
      cursor: pointer;
    }
    .content .code-toolbar button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .content .code-toolbar button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .content .codebox.is-wrapped pre,
    .content .codebox.is-wrapped code {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .content .codebox.is-wrapped .rouge-gutter { display: none; }
    .content .code-line { display: block; }
    /* Hanging indent: continuation lines sit 4 characters in from the line's own indent */
    .content .codebox.is-wrapped .code-line {
      padding-left: calc(var(--indent, 0) * 1ch + 4ch);
      text-indent: calc(var(--indent, 0) * -1ch - 4ch);
    }

    /* Let long code blocks spread past the text column on wide screens */
    @media (min-width: 800px) {
      .content .codebox.is-wide {
        --code-width: min(1000px, calc(100vw - 3rem));
        width: var(--code-width);
        margin-left: calc((100% - var(--code-width)) / 2);
      }
    }

    .content img {
      max-width: 100%;
      height: auto;
      margin: 1rem 0;
    }

    .content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 13px;
    }

    .content th, .content td {
      padding: 0.5rem;
      border: 1px solid var(--border);
      text-align: left;
    }

    .content th {
      background: var(--bg-alt);
      font-weight: 600;
    }

    /* Syntax highlighting - minimal */
    .highlight .k, .highlight .kd, .highlight .kn, .highlight .kp,
    .highlight .kr, .highlight .kt { color: #4f5966; font-weight: 600; }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .se { color: #5f6771; }
    .highlight .c, .highlight .c1, .highlight .cm, .highlight .cs { color: #8a9098; }
    .highlight .mi, .highlight .mf, .highlight .mh, .highlight .mo { color: #56606b; }
    .highlight .na, .highlight .nb { color: #657180; }
    .highlight .o, .highlight .p { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="site-title"><a href="/">{{ site.title }}</a></div>
      <nav>
        <a href="/">posts</a>
        <a href="/about/">about</a>
      </nav>
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <a href="https://github.com/westonplatter">github</a> &middot;
      <a href="https://www.linkedin.com/in/westonplatter">linkedin</a>
    </footer>
  </div>
  <script>
    (function () {
      // Rebuild a code element as one block span per line, so wrapped lines can get a hanging indent.
      function splitLines(code) {
        var lines = [[]];
        Array.prototype.slice.call(code.childNodes).forEach(function (node) {
          node.textContent.split("\n").forEach(function (part, i) {
            if (i > 0) lines.push([]);
            if (!part) return;
            var piece = node.cloneNode(false);
            piece.textContent = part;
            lines[lines.length - 1].push(piece);
          });
        });
        if (lines.length > 1 && !lines[lines.length - 1].length) lines.pop();
        code.textContent = "";
        lines.forEach(function (pieces) {
          var line = document.createElement("span");
          line.className = "code-line";
          pieces.forEach(function (piece) { line.appendChild(piece); });
          var indent = line.textContent.match(/^ */)[0].length;
          if (indent) line.style.setProperty("--indent", indent);
          if (!pieces.length) line.textContent = " ";
          code.appendChild(line);
        });
      }

      var narrow = window.matchMedia("(max-width: 699px)").matches;

      document.querySelectorAll(".content div.highlighter-rouge").forEach(function (block) {
        var pre = block.querySelector("pre.highlight");
        if (!pre) return;
        var source = block.querySelector(".rouge-code pre") || pre.querySelector("code") || pre;
        var lang = (block.className.match(/language-(\S+)/) || [])[1];
        var text = source.textContent.replace(/\n$/, "");
        splitLines(source);

        var box = document.createElement("div");
        box.className = "codebox";
        var toolbar = document.createElement("div");
        toolbar.className = "code-toolbar";
        toolbar.innerHTML =
          '<span class="code-lang">' + (lang && lang !== "plaintext" ? lang : "") + "</span>" +
          '<button type="button" class="code-wrap" aria-pressed="false">Wrap</button>' +
          '<button type="button" class="code-copy">Copy</button>';
        block.parentNode.insertBefore(box, block);
        box.appendChild(toolbar);
        box.appendChild(block);

        // Only spread past the text column when the code doesn't fit in it.
        if (pre.scrollWidth > pre.clientWidth) box.classList.add("is-wide");

        var wrapButton = toolbar.querySelector(".code-wrap");
        function setWrapped(on) {
          box.classList.toggle("is-wrapped", on);
          wrapButton.setAttribute("aria-pressed", on ? "true" : "false");
        }
        setWrapped(narrow);
        wrapButton.addEventListener("click", function () {
          setWrapped(!box.classList.contains("is-wrapped"));
        });

        var copyButton = toolbar.querySelector(".code-copy");
        function flash(label) {
          copyButton.textContent = label;
          setTimeout(function () { copyButton.textContent = "Copy"; }, 1500);
        }
        function selectCode() {
          var range = document.createRange();
          range.selectNodeContents(source);
          var selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          flash("Selected");
        }
        copyButton.addEventListener("click", function () {
          if (!navigator.clipboard) return selectCode();
          navigator.clipboard.writeText(text).then(function () { flash("Copied"); }, selectCode);
        });
      });
    })();

    (function () {
      if (!("serviceWorker" in navigator)) return;

      window.addEventListener("load", function () {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          return Promise.all(
            registrations.map(function (registration) {
              return registration.unregister();
            })
          );
        }).then(function () {
          if (!("caches" in window)) return;

          return caches.keys().then(function (keys) {
            return Promise.all(
              keys.map(function (key) {
                return caches.delete(key);
              })
            );
          });
        }).catch(function () {
          // Ignore cleanup failures. The page remains usable without them.
        });
      });
    })();
  </script>
</body>
</html>
